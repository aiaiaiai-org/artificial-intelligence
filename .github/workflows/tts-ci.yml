name: TTS adapter CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/tts/requirements.txt
      - run: python -m unittest discover -s services/tts -p 'test_*.py'
