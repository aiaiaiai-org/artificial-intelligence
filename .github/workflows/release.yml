name: Release

# A release is cut from a tag and from nothing else. Publishing what a moving branch
# happened to hold would hand consumers a version they cannot get back to.
on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.guard.outputs.version }}
      publish_npm: ${{ steps.registries.outputs.npm }}
      publish_github_packages: ${{ steps.registries.outputs.github_packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify the tagged tree was already proven by PR CI
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tagged="${GITHUB_REF_NAME#v}"
          declared="$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version'])")"
          if [ "${tagged}" != "${declared}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not name the workspace version ${declared}"
            exit 1
          fi

          git fetch --no-tags origin master
          master_sha="$(git rev-parse origin/master)"
          if [ "${GITHUB_SHA}" != "${master_sha}" ]; then
            echo "::error::release tag must name the current master commit ${master_sha}, got ${GITHUB_SHA}"
            exit 1
          fi

          read -r -a parents <<<"$(git show -s --format=%P "${GITHUB_SHA}")"
          if [ "${#parents[@]}" -ne 2 ]; then
            echo "::error::release commit must be a verified pull-request merge commit"
            exit 1
          fi
          tested_head="${parents[1]}"

          merge_tree="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          tested_tree="$(git rev-parse "${tested_head}^{tree}")"
          if [ "${merge_tree}" != "${tested_tree}" ]; then
            echo "::error::merged tree ${merge_tree} differs from tested PR head tree ${tested_tree}"
            exit 1
          fi

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${tested_head}&event=pull_request&per_page=100" \
            > /tmp/pr-runs.json

          python3 - "${tested_head}" /tmp/pr-runs.json <<'PY'
          import json
          import sys

          head = sys.argv[1]
          with open(sys.argv[2], encoding="utf-8") as source:
              runs = json.load(source)["workflow_runs"]

          required = {
              ".github/workflows/rust.yml": "Rust CI",
              ".github/workflows/web.yml": "Web adapter CI",
              ".github/workflows/repository-policy.yml": "Repository policy",
          }
          latest = {}
          for run in runs:
              path = run.get("path")
              expected_name = required.get(path)
              if expected_name is None or run.get("name") != expected_name:
                  continue
              current = latest.get(path)
              if current is None or run["id"] > current["id"]:
                  latest[path] = run

          missing = sorted(path for path in required if path not in latest)
          failed = sorted(
              path
              for path, run in latest.items()
              if run.get("status") != "completed" or run.get("conclusion") != "success"
          )
          if missing or failed:
              parts = []
              if missing:
                  parts.append(f"missing canonical workflows: {', '.join(missing)}")
              if failed:
                  parts.append(f"not green: {', '.join(failed)}")
              print(f"::error::PR head {head} is not fully verified ({'; '.join(parts)})")
              raise SystemExit(1)
          PY

          echo "version=${tagged}" >> "${GITHUB_OUTPUT}"
          echo "verified PR head ${tested_head}; correctness CI is reused, not rerun"

      - name: Which registries this release can reach
        id: registries
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          publish_npm=false
          if [ -n "${NPM_TOKEN:-}" ]; then
            publish_npm=true
          else
            echo "::notice::NPM_TOKEN is not configured; public npm is unavailable"
          fi
          echo "npm=${publish_npm}" >> "${GITHUB_OUTPUT}"

          # GitHub Packages resolves an npm scope to the repository owner, so it can only
          # accept packages named @<owner>/*. Ours are @aiaiaiai/* and the owner is
          # aiaiaiai-org, so this is a naming decision rather than a missing credential.
          owner="${GITHUB_REPOSITORY%%/*}"
          scope="$(npm pkg get name --workspaces --json | node -e '
            const packages = JSON.parse(require("node:fs").readFileSync(0, "utf-8"));
            const scopes = new Set(Object.values(packages).map((name) => name.split("/")[0]));
            process.stdout.write([...scopes].join(","));
          ')"

          publish_github_packages=false
          if [ "${scope}" = "@${owner}" ]; then
            publish_github_packages=true
          else
            echo "::notice::packages are scoped ${scope} and the repository owner is ${owner}; GitHub Packages accepts only @${owner}/*"
          fi
          echo "github_packages=${publish_github_packages}" >> "${GITHUB_OUTPUT}"

          if [ "${publish_npm}" != true ] && [ "${publish_github_packages}" != true ]; then
            echo "::error::no npm registry is reachable; configure NPM_TOKEN or align the package scope with the repository owner before cutting a release"
            exit 1
          fi

      # Building the package is release work, not a second correctness suite. The tarballs
      # are produced once here and the publishing jobs consume these exact artifacts.
      - run: npm ci
      - name: Build npm release artifacts once
        run: |
          set -euo pipefail
          rm -rf release-packages
          mkdir -p release-packages
          npm pack --workspaces --pack-destination release-packages
          test -n "$(find release-packages -maxdepth 1 -type f -name '*.tgz' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages-${{ steps.guard.outputs.version }}
          path: release-packages/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.publish_npm == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages-${{ needs.prepare.outputs.version }}
          path: release-packages
      - name: Publish exact prepared artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: ./scripts/publish_packages.sh https://registry.npmjs.org release-packages/*.tgz

  publish-github-packages:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.publish_github_packages == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages-${{ needs.prepare.outputs.version }}
          path: release-packages
      - name: Publish exact prepared artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish_packages.sh https://npm.pkg.github.com release-packages/*.tgz
