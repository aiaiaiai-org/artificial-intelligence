name: Rust CI

on:
  # Every pull request, whatever it targets. A change stacked on another branch has to
  # prove itself before that branch merges, not after.
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Bootstrap lockfile
        run: test -f Cargo.lock || cargo generate-lockfile
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Architecture dependency boundary
        run: python3 scripts/check_architecture.py

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap lockfile
        run: test -f Cargo.lock || cargo generate-lockfile
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
