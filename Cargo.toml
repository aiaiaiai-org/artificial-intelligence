[workspace]
members = [
    "crates/aiai-contracts",
    "crates/aiai-runtime",
    "crates/aiai-signal",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0"
repository = "https://github.com/aiaiaiai-org/artificial-intelligence"
authors = ["aiaiaiai"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
