[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aiai-speech"
version = "0.1.0"
description = "Product-independent local speech inference adapter"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
